name: Daily Auto-Blog Generation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # 매일 UTC 23:00 (한국 시간 아침 8시)에 실행
    - cron: '0 23 * * *'
  # 수동 실행 트리거 지원 (GitHub 탭에서 버튼으로 즉시 실행 가능)
  workflow_dispatch:

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate AI Blog Post
        run: node scripts/generate-post.mjs
        env:
          # GitHub Secrets에 GEMINI_API_KEY가 반드시 등록되어 있어야 합니다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "TripMaker AI Editor"
          git config --global user.email "bot@tripmaker.ai"
          git add content/posts/ public/images/posts/
          # 생성된 파일이 있을 경우에만 커밋
          git commit -m "docs(blog): auto-generate daily SEO blog post" || echo "No changes to commit"
          git push origin main
